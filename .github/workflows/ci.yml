name: CI

# Every install here runs `--ignore-scripts`. On a `pull_request` from a fork
# the checked-out tree is untrusted, and a plain `pnpm install` executes
# lifecycle scripts from THAT tree: the root package.json's own
# preinstall/postinstall/prepare (always run, allowlist or not) and any package
# the branch adds to `allowBuilds` in pnpm-workspace.yaml. Skipping them is
# harmless here: husky's `prepare` means nothing in CI, and the build's native
# tools (esbuild, workerd, sharp) ship as prebuilt platform packages.
#
# That does not stop CI running PR code: the test and build jobs execute the
# branch's own tests and `vite.config.ts` by definition. What keeps a fork PR
# harmless is that this workflow holds no secrets and only a read-only token,
# with credentials not persisted into the checkout. Keep it that way: a job here
# must never gain a secret or a write permission.
#
# Every action is pinned by commit SHA (Renovate proposes updates with their
# version comments, for a human to merge), so a moved tag can't change what
# runs.
#
# The alternative — not running CI on fork PRs — was rejected: contributors
# would get no signal, which is worse than the residual risk of building
# untrusted source with scripts off.

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy `.env.example` files to `.env`
        shell: bash
        run: find . -type f -name ".env.example" -exec sh -c 'cp "$1" "${1%.*}"' _ {} \;

      # --error-on-warnings, because a warning nobody fails on is a warning
      # nobody reads. A class-order warning shipped to main this way: the local
      # habit is `check:write`, which does not fix nursery rules, and the tail
      # of a passing run looks identical whether the count is 0 or 1. The tree
      # is at zero warnings, so this costs nothing until something regresses —
      # and then it says so here rather than three commits later.
      - name: Run linter
        run: |
          pnpm check --error-on-warnings

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy `.env.example` files to `.env`
        shell: bash
        run: find . -type f -name ".env.example" -exec sh -c 'cp "$1" "${1%.*}"' _ {} \;

      - name: Run typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy `.env.example` files to `.env`
        shell: bash
        run: find . -type f -name ".env.example" -exec sh -c 'cp "$1" "${1%.*}"' _ {} \;

      - name: Run tests
        run: pnpm test

  # Workers Builds also compiles every push and PR, so this looks like a
  # duplicate — and while that check was REQUIRED, it was one, which is why this
  # job did not exist. That stopped being true: Workers Builds does not report at
  # all on PRs that touch no source, so as a required check it blocked those
  # forever, and it had to be dropped to advisory. Dropping it left nothing
  # required standing between a broken build and the merge button.
  #
  # This job exists to be that thing. It is a GitHub Actions job on a workflow
  # with no path filter, so it reports on EVERY pull request — which is the
  # single property Workers Builds could not offer. The duplicated minute is the
  # price of a check that always answers.
  #
  # It also catches a class the other three cannot. Lint, typecheck and tests all
  # pass while a stylesheet imports a package that is no longer installed; only a
  # build resolves that, and it has already happened here once.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy `.env.example` files to `.env`
        shell: bash
        run: find . -type f -name ".env.example" -exec sh -c 'cp "$1" "${1%.*}"' _ {} \;

      - name: Build
        run: pnpm build
