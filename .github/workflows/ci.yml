name: CI

# Every install here runs `--ignore-scripts`. On a `pull_request` from a fork
# the checked-out tree is untrusted, and a plain `pnpm install` executes
# lifecycle scripts from THAT tree: the root package.json's own
# preinstall/postinstall/prepare (always run, allowlist or not) and any package
# the branch adds to `allowBuilds` in pnpm-workspace.yaml. Both are
# contributor-editable in a PR, i.e. arbitrary code on the runner. Skipping
# scripts costs us only husky's `prepare` hook, which is meaningless in CI.
#
# The alternative — not running CI on fork PRs — was rejected: contributors
# would get no signal, which is worse than the residual risk of building
# untrusted source with scripts off.

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy `.env.example` files to `.env`
        shell: bash
        run: find . -type f -name ".env.example" -exec sh -c 'cp "$1" "${1%.*}"' _ {} \;

      - name: Run linter
        run: |
          pnpm check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy `.env.example` files to `.env`
        shell: bash
        run: find . -type f -name ".env.example" -exec sh -c 'cp "$1" "${1%.*}"' _ {} \;

      - name: Run typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy `.env.example` files to `.env`
        shell: bash
        run: find . -type f -name ".env.example" -exec sh -c 'cp "$1" "${1%.*}"' _ {} \;

      - name: Run tests
        run: pnpm test

# NOTE: no `build` job here on purpose — Workers Builds compiles every push
# (staging deploys) and every PR (preview versions); a second build on GitHub
# runners duplicates it for zero signal.
