name: secret-scan

# Birth-and-ongoing leak defense for the public repo. Runs on every PR and on
# pushes to the deploy branches. Intended to be a REQUIRED status check (enable
# in branch protection).

on:
  pull_request:
    branches: ["*"]
    # `edited` is here for the PR-body scan below: a body can acquire a leak
    # long after the last push, and without this type that edit is never seen.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: ["release"]  # main pushes arrive via PRs, already scanned there
  merge_group:

permissions:
  contents: read

jobs:
  # Deliberately a SMALL stack: GitHub push-protection blocks known credential
  # formats at push time and GitGuardian monitors at the account level, so CI
  # adds only what those can't do — trufflehog in verified-only mode, which
  # fails solely on live, provider-confirmed credentials. Pattern-only modes
  # were removed after false-positiving on our own SSRF-refusal test fixtures.
  trufflehog:
    name: trufflehog (verified + unknown secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          path: ./
          # The action adds --fail itself; repeating it is a fatal flag error.
          extra_args: --results=verified

  agent-file-hygiene:
    name: reject invisible unicode in agent/rules files
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Scan agent-instruction & rules files for non-printing characters
        shell: bash
        run: |
          set -euo pipefail

          # Agent-instruction files are executable configuration; invisible or
          # zero-width / bidirectional-control Unicode in them is a known
          # injection vector (the "Rules File Backdoor"). Reject it.
          # NOTE: CLAUDE.md is a symlink to AGENTS.md; grep follows it.
          mapfile -t candidates < <(
            git ls-files \
              'AGENTS.md' 'CLAUDE.md' '**/AGENTS.md' '**/CLAUDE.md' \
              '.cursorrules' '.windsurfrules' \
              '.cursor/rules/**' '.github/copilot-instructions.md' 2>/dev/null || true
          )

          files=()
          for f in "${candidates[@]}"; do
            [ -e "$f" ] && files+=("$f")
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No agent/rules files found to scan."
            exit 0
          fi

          echo "Scanning: ${files[*]}"

          # Disallowed ranges: soft hyphen; zero-width & directional marks;
          # line/paragraph separators; bidi embeddings/overrides/isolates and
          # deprecated format chars; word joiner & invisible math operators;
          # BOM / zero-width no-break space; Unicode tag characters.
          PATTERN='[\x{00AD}\x{200B}-\x{200F}\x{2028}\x{2029}\x{202A}-\x{202E}\x{2060}-\x{2064}\x{2066}-\x{206F}\x{FEFF}\x{E0000}-\x{E007F}]'

          if grep -nP "$PATTERN" "${files[@]}"; then
            echo "::error::Non-printing / invisible Unicode found in an agent/rules file (see matches above). These files must be visible printable text only."
            exit 1
          fi

          echo "OK — no non-printing characters in agent/rules files."

  # Everything a push publishes is in scope here, not just the diff: tracked
  # file contents, the commit messages that carry them, and the pull-request
  # body that describes them. A leak reads the same in any of the three, and
  # the last two are the ones no file-content scanner ever looks at.
  #
  # Findings are reported as file/line locations ONLY. The pattern list can be
  # supplemented from a repository secret, so echoing matched text would print
  # the very thing the secret exists to keep out of the logs.
  local-paths:
    name: repository hygiene (files, commit messages, PR body)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # The commit-message scan needs the range's history, which the
          # default shallow fetch does not have.
          fetch-depth: 0

      - name: Assemble the pattern list
        shell: bash
        env:
          # Optional. One POSIX extended-regex per line. Absent on forks and on
          # any repo that never set it — the inline patterns below still run,
          # so this degrades to the previous behaviour rather than failing.
          SUPPLEMENTAL_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          set -euo pipefail

          PATTERNS="$RUNNER_TEMP/hygiene-patterns.txt"

          # Always-on, in the clear because it is generic: an absolute path from
          # somebody's home directory is never correct in a tracked file. It
          # cannot work on any other machine, and it discloses the layout of the
          # one it came from. Tooling that hardcodes one is tooling nobody else
          # can run.
          cat > "$PATTERNS" <<'PATTERN_EOF'
          (^|[^A-Za-z0-9_])(/home/[a-z]|/Users/[A-Za-z]|~/(Development|Documents|Desktop)/)
          PATTERN_EOF

          extra=0
          if [ -n "${SUPPLEMENTAL_PATTERNS:-}" ]; then
            printf '%s\n' "$SUPPLEMENTAL_PATTERNS" \
              | grep -v '^[[:space:]]*$' >> "$PATTERNS" || true
            extra=$(grep -cv '^[[:space:]]*$' <<< "$SUPPLEMENTAL_PATTERNS" || true)
          fi

          # A malformed supplemental regex would make every grep below exit 2 —
          # which `if` reads as "no match", turning the whole guard into a
          # silent pass. Probe it against an empty file first: 1 means valid and
          # unmatched, anything above that means the list itself is broken.
          # stderr is dropped so an invalid pattern is not echoed into the log.
          set +e
          grep -qE -f "$PATTERNS" /dev/null 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::The supplemental pattern list is not valid POSIX extended-regex. Fix the LEAK_PATTERNS repository secret (one regex per line, no comments)."
            exit 1
          fi

          echo "Patterns loaded: $(wc -l < "$PATTERNS") ($extra supplemental)."
          echo "HYGIENE_PATTERNS=$PATTERNS" >> "$GITHUB_ENV"

      - name: Scan tracked files
        shell: bash
        run: |
          set -euo pipefail

          # This workflow carries the inline patterns as literals, so scanning
          # it would always match itself.
          mapfile -t files < <(git ls-files | grep -v '^\.github/workflows/secret-scan\.yml$')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked files to scan."
            exit 0
          fi

          set +e
          hits=$(grep -nEI -f "$HYGIENE_PATTERNS" "${files[@]}")
          rc=$?
          set -e

          # 0 = matched, 1 = clean, >1 = grep itself failed. The third case must
          # not be mistaken for the second — an `if` would read both as "clean".
          if [ "$rc" -gt 1 ]; then
            echo "::error::The tracked-file scan could not run (grep exit ${rc})."
            exit 1
          fi

          if [ "$rc" -eq 0 ]; then
            # -n with p: a line the location pattern does not match is DROPPED
            # rather than echoed, so matched text can never reach the log.
            printf '%s\n' "$hits" | sed -nE 's/^([^:]+:[0-9]+):.*/  \1/p'
            echo "::error::A tracked file matches a repository-hygiene pattern (locations above). For machine-local paths, use a relative path, a documented environment variable, or a discoverable command."
            exit 1
          fi

          echo "OK — no hygiene-pattern matches in tracked files."

      - name: Scan commit messages
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # A commit message is published verbatim and is far harder to redact
          # than a file: rewriting it means rewriting history everyone has
          # already pulled. Catching it at the pull request is the only cheap
          # moment.
          case "$EVENT_NAME" in
            pull_request) range="origin/${BASE_REF}..HEAD" ;;
            push)         range="${PUSH_BEFORE}..${PUSH_AFTER}" ;;
            *)
              echo "No commit range for a ${EVENT_NAME} event — skipping."
              exit 0
              ;;
          esac

          # The checkout fetches every branch, so the base is normally already
          # here; fetch it explicitly rather than skip if some day it isn't.
          if [ "$EVENT_NAME" = "pull_request" ] \
             && ! git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
            git fetch --no-tags --quiet origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
          fi

          # A branch created by this push has an all-zero `before`, and a
          # force-push can leave the old tip unreachable. Neither is a leak;
          # both make the range genuinely unresolvable.
          if ! git rev-list -n1 "$range" >/dev/null 2>&1; then
            echo "::warning::Commit range is not resolvable in this checkout — skipping the commit-message scan."
            exit 0
          fi

          msg="$RUNNER_TEMP/commit-message.txt"
          found=0
          while read -r sha; do
            # Written to a file rather than piped into grep: with `pipefail`, a
            # `grep -q` match closes the pipe, git exits 141, and the pipeline
            # reports failure — i.e. a hit would read as a miss.
            git log -1 --format=%B "$sha" > "$msg"
            if grep -qE -f "$HYGIENE_PATTERNS" "$msg"; then
              echo "  commit $sha"
              found=1
            fi
          done < <(git rev-list "$range")

          if [ "$found" -eq 1 ]; then
            echo "::error::A commit message in this range matches a repository-hygiene pattern (commits above). Amend or rebase to reword it before merging."
            exit 1
          fi

          echo "OK — no hygiene-pattern matches in commit messages."

      - name: Scan the pull-request body
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          # Through the environment, never interpolated into the command line:
          # a PR body is attacker-controlled text and `${{ }}` in a `run:` is
          # substituted before bash ever sees it, which is a shell-injection.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          body="$RUNNER_TEMP/pr-body.txt"
          printf '%s\n' "${PR_BODY:-}" > "$body"

          set +e
          hits=$(grep -nE -f "$HYGIENE_PATTERNS" "$body")
          rc=$?
          set -e

          if [ "$rc" -gt 1 ]; then
            echo "::error::The pull-request body scan could not run (grep exit ${rc})."
            exit 1
          fi

          if [ "$rc" -eq 0 ]; then
            printf '%s\n' "$hits" | sed -nE 's/^([0-9]+):.*/  pull-request body, line \1/p'
            echo "::error::The pull-request description matches a repository-hygiene pattern (lines above). Edit the description; this check re-runs on edit."
            exit 1
          fi

          echo "OK — no hygiene-pattern matches in the pull-request body."
