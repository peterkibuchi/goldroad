name: close-rename-prs

# Workers Builds opens a "rename wrangler config to match the deployed Worker"
# PR whenever a deployed Worker's name differs from the top-level config name.
# Ours differ BY DESIGN: the top level is the generic self-host target and the
# deployed names live in env blocks selected at build time (CLOUDFLARE_ENV).
# Closed by hand three times (#1, #3, #12) — now automated.

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: startsWith(github.head_ref, 'update_worker_name_to_')
    runs-on: ubuntu-latest
    steps:
      - name: Close with explanation
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --delete-branch --comment \
          "Auto-closed: the top-level wrangler \`name\` is the generic self-host target by design — deployed Workers get their names from the \`env.*\` blocks selected at build time via \`CLOUDFLARE_ENV\`. See #1, #3, #12."
